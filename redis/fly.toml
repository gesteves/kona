app = 'kona-redis'
primary_region = 'iad'

[build]
  image = 'redis:7-alpine'

# Persistence is AOF only. `--save ""` disables RDB snapshotting, which is redundant: AOF at
# `everysec` already covers each durable key below, and the rest of the keyspace is either a cache
# with a TTL or a Sidekiq queue. `save 60 1` on top costs a BGSAVE fork roughly every 60 seconds
# (measured: 36,319 forks over 25 days of uptime) purely to re-persist what AOF already holds.
#
# ⚠️ Dropping it is a cleanup, not a fix for the RedisClient::ReadTimeoutError alerts — those forks
# were cheap (latest_fork_usec 3921, i.e. ~4ms, on a ~3MB dataset) and were never the stall. See
# api/config/initializers/sidekiq.rb for what actually addresses the timeouts.
#
# `--no-appendfsync-on-rewrite yes` stops the main thread blocking on fsync while a rewrite child
# is competing for the same volume — the one persistence path here that CAN stall the event loop.
#
# ⚠️ This instance holds DURABLE records that no code can make again, and nothing else holds a
# copy: `contact:spam`, `maps:tracks`, the four `*:credentials` hashes, the Whoop refresh token,
# `location:current`, `standard_site:did`, and `standard_site:fingerprints`. **None of them has a
# TTL.** Each cache key and each lock key does. Refer to api/CLAUDE.md.
#
# ⚠️ **The policy is `volatile-lru`, and NOT `noeviction`.** At the cap, `noeviction` refuses EACH
# write, and that includes the credential write that a reconnect needs to correct the problem.
# `volatile-lru` removes a key with a TTL only, thus it can never touch a durable key above.
# ⚠️ The cost is that Redis can remove a lock or an idempotency key at the cap, thus a retry of a
# social post could post two times. That applies at 256mb only, against a measured 3MB dataset.
# ⚠️ `maxmemory` applies to the FULL instance and not to one logical database. Thus a second `db`
# index gives the cache no limit of its own, and it is not a way to separate the two.
#
# Redis accepts both `--save ""` and a bare `--save` as "snapshotting off" (verified against
# redis-server directly), so this is safe whichever way fly's command parser treats the quotes.
# Verify after deploy: `fly ssh console -a kona-redis -C "redis-cli config get save"` → empty.
[processes]
  app = "redis-server --dir /data --save '' --appendonly yes --appendfsync everysec --no-appendfsync-on-rewrite yes --maxmemory 256mb --maxmemory-policy volatile-lru"

[mounts]
  source = "redis_data"
  destination = "/data"

[[services]]
  protocol = 'tcp'
  internal_port = 6379
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 6379

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
