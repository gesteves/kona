
[functions]
  node_bundler = "esbuild"

[build]
  base = "web"
  command = "bundle exec rake build"
  publish = "build/"

# Headers live in web/source/headers and redirects in web/source/redirects.erb (both
# renamed to their underscore forms at build) — file conventions Netlify and Cloudflare
# Workers Static Assets both honor, so they carry over the migration unchanged.
