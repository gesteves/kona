
[functions]
  node_bundler = "esbuild"

[functions.og]
  included_files = [
    "build/og/data.json",
    "source/fonts/IBMPlexSansCondensed-Bold.ttf"
  ]
  external_node_modules = ["@vercel/og"]

[build]
  base = "web"
  command = "bundle exec rake build"
  publish = "build/"

# Headers live in web/source/headers and redirects in web/source/redirects.erb (both
# renamed to their underscore forms at build), so every header and redirect rule has a
# single source — and one that isn't tied to this file's format.
