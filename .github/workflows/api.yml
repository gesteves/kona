name: "API"

# ⚠️ `push` applies to main only, on purpose. With ["*"], each push to a branch with an open PR ran
# the checks two times: one time for the push (refs/heads/<branch>) and one time for the PR
# (refs/pull/N/merge). These are different `github.ref` values, thus the concurrency group below
# cannot make them one. The pull_request trigger covers the work on a branch.
# `paths` includes the composite actions, because the notify job below uses them. Without the
# entry, a change to one of them would run no CI at all.
#
# ⚠️ The `web/source/partials/...` entries are correct and must stay. They are not files of this
# app: they are the placeholders that api/spec/contracts/widget_markup_contract_spec.rb reads
# across the monorepo, with Rails.root.join("../web"), to check that each widget fragment still
# agrees with the element that it replaces. With a filter on 'api/**' alone, that spec ran only
# when the api half changed. Thus a change to a placeholder, which is the more probable change,
# did not do the one check that compares the two. Keep this list the same as WIDGET_MARKUP_PAIRS
# in that spec.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/actions/**'
      - 'web/source/partials/placeholders/**'
      - 'web/source/partials/_upcoming_races.html.erb'
      - 'web/source/partials/article/_full.html.erb'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/actions/**'
      - 'web/source/partials/placeholders/**'
      - 'web/source/partials/_upcoming_races.html.erb'
      - 'web/source/partials/article/_full.html.erb'

# No job writes to the repository. The deploy uses FLY_API_TOKEN for fly, and not GITHUB_TOKEN.
# Set GITHUB_TOKEN to read-only here. Do not use the default value of the repository.
permissions:
  contents: read

# ⚠️ cancel-in-progress is OFF for main, on purpose, because this group includes the deploy job. A
# stop of `flyctl deploy` during a run can leave the app machine and the worker machine on
# different versions. fly changes the machines one at a time, thus there is no equivalent of the
# wrangler behavior, where the new version goes live only at the end (refer to the note in
# web.yml). On a branch or a PR the group covers only the tests, where a stop of an old run costs
# nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruby-tests:
    name: Ruby tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    env:
      RAILS_ENV: test
      REDIS_URL: redis://localhost:6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: api
          bundler-cache: true

      # ⚠️ This is necessary, and only this job needs it. `Bundler.require` in
      # config/application.rb loads ruby-vips, which opens the shared library at that moment. Thus
      # rspec cannot boot Rails without it, and a stub of Vips::Image does not help. The `security`
      # job needs nothing: RuboCop and Brakeman parse the source, and bundler-audit reads the
      # lockfile. The `deploy` job needs nothing: `flyctl deploy --remote-only` makes the image on
      # the builder of fly, and the Dockerfile installs libvips there.
      # ⚠️ Keep the virtual name `libvips`, and do not write libvips42t64. The virtual name stays
      # correct through each Ubuntu package rename, and the t64 suffix is one of those renames.
      # --no-install-recommends is necessary: the approximately 33 dependencies below libvips
      # (ImageMagick, poppler, librsvg, and more) declare recommends that apt installs by default.
      # web.yml does the same, for the same reason.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      # ⚠️ This is necessary. spec/requests/sessions_spec.rb renders /login through layouts/auth,
      # which calls stylesheet_link_tag "admin". Propshaft raises MissingAssetError when the
      # esbuild output is absent, and it gives no smaller result.
      - name: Install JavaScript dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: bundle exec rspec

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: api
          bundler-cache: true

      # The omakase ruleset of Rails, with no change. Refer to api/.rubocop.yml.
      - name: RuboCop (style)
        run: bundle exec rubocop --no-color

      - name: Brakeman (static analysis)
        run: bundle exec brakeman -q --no-pager

      - name: bundler-audit (dependency CVEs)
        run: bundle exec bundle-audit check --update

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ruby-tests, security]
    if: always()

    steps:
      # This job only sends a message to Slack. The checkout is here only to make the local
      # composite actions below available. Get .github only, and not the full tree.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (success)
        if: ${{ needs.ruby-tests.result == 'success' && needs.security.result == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API checks passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "good"
          fallback: "API checks passed on ${{ env.BRANCH_NAME }}"

      - name: Notify Slack (failure)
        if: ${{ needs.ruby-tests.result == 'failure' || needs.security.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "API checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ruby-tests, security]
    concurrency: deploy-kona-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI context
        uses: ./.github/actions/ci-context

      # (There is no "deploy starting" message, and web.yml is the same. A deploy already sends a
      # message on a success or on a failure, and a third message for each deploy was too much.
      # Nothing depends on it. This also removed the one link to the fly monitoring dashboard. Put
      # that link on the failure message below if you need it, and do not add a full message.)
      #
      # ⚠️ This points at a commit SHA, and NOT at @master and NOT at the `1.6` tag. This runs in
      # the job that holds FLY_API_TOKEN. Thus with a ref that a person can *move*, the code that
      # the other repository later puts at that ref runs here with the deploy credential. A tag can
      # move, as a branch can. A SHA is a hash of the content, thus the code cannot change. The
      # comment at the end gives the version for a person to read. The github-actions updater of
      # Dependabot changes both.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # ⚠️ --remote-only builds on the builder of fly, and not on this runner. Thus the token for
      # the private registry must go with the build. --build-secret is what puts it on the BuildKit
      # secret mount that the Dockerfile reads. Without it, `npm ci` gets a 401 and each deploy
      # fails.
      - name: Deploy to Fly.io
        id: fly_deploy
        working-directory: api
        run: flyctl deploy --remote-only --build-secret WEBAWESOME_NPM_TOKEN="$WEBAWESOME_NPM_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <${{ secrets.KONA_API_URL }}|successful> :rocket:"
          color: "good"
          fallback: "API deploy successful"

      - name: Notify Slack (deploy failed)
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "API deploy failed"
