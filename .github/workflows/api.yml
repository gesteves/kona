name: "API"

on:
  push:
    branches: ["*"]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby-tests:
    name: Ruby tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    env:
      RAILS_ENV: test
      REDIS_URL: redis://localhost:6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

  security:
    name: Security scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true

      - name: Brakeman (static analysis)
        run: bundle exec brakeman -q --no-pager

      - name: bundler-audit (dependency CVEs)
        run: bundle exec bundle-audit check --update

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    needs: [ruby-tests, security]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (success)
        if: ${{ needs.ruby-tests.result == 'success' && needs.security.result == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API checks passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "good"
          fallback: "API checks passed on ${{ env.BRANCH_NAME }}"

      - name: Notify Slack (failure)
        if: ${{ needs.ruby-tests.result == 'failure' || needs.security.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "API checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [ruby-tests, security]
    concurrency: deploy-kona-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (deploy starting)
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <https://fly.io/apps/kona-api/monitoring|starting> :hourglass_flowing_sand:"
          color: "#439FE0"
          fallback: "API deploy starting: https://fly.io/apps/kona-api/monitoring"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: fly_deploy
        working-directory: api
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <${{ secrets.KONA_API_URL }}|successful> :rocket:"
          color: "good"
          fallback: "API deploy successful: ${{ secrets.KONA_API_URL }}"

      - name: Notify Slack (deploy failed)
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "API deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
