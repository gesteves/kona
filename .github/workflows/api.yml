name: "API"

# ⚠️ `push` is scoped to main on purpose. It used to be ["*"], which meant every push to a
# branch with an open PR ran the checks twice — once for the push (refs/heads/<branch>) and once
# for the PR (refs/pull/N/merge). Those are different `github.ref` values, so the concurrency
# group below never collapsed them. Branch work is covered by the pull_request trigger.
# The composite actions are in `paths` because the notify job below uses them — without the
# entry, editing one would trigger no CI at all.
#
# ⚠️ The `web/source/partials/...` entries are deliberate and must stay. They are not this app's
# files: they're the placeholders that api/spec/contracts/widget_markup_contract_spec.rb reads
# across the monorepo (via Rails.root.join("../web")) to check each widget fragment still matches
# the element it replaces. Filtered on 'api/**' alone, that spec only ran when the api half
# changed — so editing a placeholder, which is the more likely edit, silently skipped the only
# check that compares the two. Keep this list in step with WIDGET_MARKUP_PAIRS in that spec.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/actions/**'
      - 'web/source/partials/placeholders/**'
      - 'web/source/partials/_upcoming_races.html.erb'
      - 'web/source/partials/article/_full.html.erb'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
      - '.github/actions/**'
      - 'web/source/partials/placeholders/**'
      - 'web/source/partials/_upcoming_races.html.erb'
      - 'web/source/partials/article/_full.html.erb'

# No job writes to the repository — the deploy authenticates to fly with FLY_API_TOKEN, not
# GITHUB_TOKEN. Pin it read-only rather than inheriting the repo-wide default.
permissions:
  contents: read

# ⚠️ cancel-in-progress is deliberately OFF for main, because this group covers the deploy job.
# Cancelling `flyctl deploy` mid-run can leave the app/worker machines on mixed versions — fly
# rolls machines one at a time, so there's no equivalent of the wrangler guarantee that the new
# version only goes live at the very end (see the note in web.yml). On branches/PRs the group
# only covers tests, where cancelling a superseded run is free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruby-tests:
    name: Ruby tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    env:
      RAILS_ENV: test
      REDIS_URL: redis://localhost:6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: api
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      # ⚠️ Not optional. spec/requests/sessions_spec.rb renders /login through layouts/auth, which
      # calls stylesheet_link_tag "admin" — and Propshaft raises MissingAssetError rather than
      # degrading when the esbuild output isn't there.
      - name: Install JavaScript dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: bundle exec rspec

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: api
          bundler-cache: true

      # Rails' omakase ruleset, inherited verbatim — see api/.rubocop.yml.
      - name: RuboCop (style)
        run: bundle exec rubocop --no-color

      - name: Brakeman (static analysis)
        run: bundle exec brakeman -q --no-pager

      - name: bundler-audit (dependency CVEs)
        run: bundle exec bundle-audit check --update

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ruby-tests, security]
    if: always()

    steps:
      # This job only posts to Slack; the checkout exists solely so the local composite actions
      # below resolve. Fetch just .github rather than the whole tree.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (success)
        if: ${{ needs.ruby-tests.result == 'success' && needs.security.result == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API checks passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "good"
          fallback: "API checks passed on ${{ env.BRANCH_NAME }}"

      - name: Notify Slack (failure)
        if: ${{ needs.ruby-tests.result == 'failure' || needs.security.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "API checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ruby-tests, security]
    concurrency: deploy-kona-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI context
        uses: ./.github/actions/ci-context

      # (No "deploy starting" notification, matching web.yml — a deploy already posts on success
      # or failure, and a third message per deploy was noise. Nothing keys off it. This also
      # dropped the only link to the fly monitoring dashboard; put it back on the failure message
      # below if it's ever missed, rather than reinstating a whole extra notification.)
      #
      # ⚠️ Pinned to a commit SHA, NOT @master and not the `1.6` tag. This runs in the job that
      # holds FLY_API_TOKEN, so any ref that can be *moved* means whatever that third-party repo
      # points it at later executes here with the deploy credential — and a tag is movable, not
      # just a branch. A SHA is a content hash, so the code can't change under us. The trailing
      # comment is the human-readable version; Dependabot's github-actions updater bumps both.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # ⚠️ --remote-only builds on fly's builder, not this runner, so the private-registry token
      # has to travel with the build. --build-secret is what puts it on the BuildKit secret mount
      # the Dockerfile reads; without it `npm ci` 401s and every deploy fails.
      - name: Deploy to Fly.io
        id: fly_deploy
        working-directory: api
        run: flyctl deploy --remote-only --build-secret WEBAWESOME_NPM_TOKEN="$WEBAWESOME_NPM_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <${{ secrets.KONA_API_URL }}|successful> :rocket:"
          color: "good"
          fallback: "API deploy successful"

      - name: Notify Slack (deploy failed)
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "API deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "API deploy failed"
