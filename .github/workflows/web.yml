name: "Web"

# Builds and deploys the Middleman static site to the kona-web Cloudflare Worker.
#
# Triggers:
#   - push to main / PR touching web/**  -> item 1: only rebuild when the web app actually
#     changed (an api/-only or utilities/-only change never runs this workflow).
#     ⚠️ `push` is scoped to main on purpose. It used to be ["*"], which meant every push to a
#     branch with an open PR ran `checks` twice — once for the push (refs/heads/<branch>) and
#     once for the PR (refs/pull/N/merge). Those are different `github.ref` values, so the
#     concurrency group below never collapsed them. Work on a branch is covered by the
#     pull_request trigger; main is covered here.
#   - repository_dispatch: contentful-publish -> item 2: kona-api fires this when content is
#     published/unpublished in Contentful (see api/app/jobs/site_build_job.rb).
#   - repository_dispatch: api-build -> the same job, fired by a POST to the api's /api/build
#     endpoint (bearer-gated) — a programmatic "rebuild now" for scripts and automation. Both
#     types run identically here; they're separate only so the Slack notification can say which
#     one triggered the deploy (see .github/actions/ci-context/action.yml).
#   - workflow_dispatch -> manual "Run workflow" button (from main). An on-demand rebuild:
#     the build always pulls Contentful drafts (preview token + `preview: true`) and renders
#     each to /id/<entry-id>/ (noindex, unlisted), but only publish/unpublish/delete fires a
#     build — so this is how you surface an in-progress draft without publishing it.
#
# The composite actions are in `paths` too: they're used by the jobs below, so a change to one
# of them needs to run this workflow — without the entry it would trigger no CI at all.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/**'
  repository_dispatch:
    types: [contentful-publish, api-build]
  workflow_dispatch:

# No job writes to the repository — the deploy and the cache purge authenticate with
# CLOUDFLARE_API_TOKEN and Slack with its webhook, never GITHUB_TOKEN. Pin it read-only rather
# than inheriting whatever the repo-wide default happens to be.
permissions:
  contents: read

# Coalesce rapid pushes / content publishes: a newer run cancels the in-flight one so we only
# build the latest. Safe mid-deploy — wrangler activates the new Worker version only at the very
# end, so a cancelled deploy leaves the current version live.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skipped on a Contentful publish (repository_dispatch) and a manual rebuild
    # (workflow_dispatch): both just rebuild the code already on main against current content, so
    # there's nothing new to test/lint/typecheck — and the code on main already passed checks when
    # it was pushed. Keeps content republishes and on-demand preview rebuilds off the ~1-minute
    # test critical path.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: web
          bundler-cache: true

      # One of the slower steps here, though it moves a lot with the apt mirror: measured at 13s
      # and at 48s in `deploy` on different runs, against ~16s for the site build itself. That
      # ratio is why moving blurhash generation into the api to drop this install was considered
      # and dropped — it wouldn't buy back meaningful wall-clock. libvips isn't on the runner
      # image, so the whole tree is downloaded fresh: `libvips` is a *virtual* package provided
      # by libvips42t64, which pulls ~33 direct dependencies (ImageMagick, poppler, librsvg,
      # heif, jxl...). libvips42t64 itself declares no Recommends, but everything underneath it
      # does, and apt installs recommends by default — hence --no-install-recommends. Keep the
      # virtual name rather than libvips42t64: it survives Ubuntu's package renames (the t64
      # suffix is itself one).
      # ⚠️ Needed in BOTH jobs. web/lib/helpers/image_helpers.rb requires 'vips' at the top
      # level, so rspec can't even load the helper without it — the specs stubbing Vips::Image
      # doesn't help.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # rspec directly, NOT `rake test`: loading the Rakefile requires the data layer, which
      # introspects the live Contentful schema at boot (needs creds/network). rspec loads only the
      # specs, and contentful_spec stubs that client, so the suite runs credential-free in CI.
      - name: Ruby tests
        run: bundle exec rspec

      - name: Worker tests
        run: npm test

      - name: Typecheck the Worker
        run: npm run check

      - name: RuboCop (style)
        run: bundle exec rubocop --no-color

      # Covers source/javascripts/** and test/browser/**, which `npm run check` doesn't reach —
      # both tsconfigs include only src/ and test/*.ts. See eslint.config.mjs.
      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint stylesheets
        run: npm run lint:scss

      - name: Check formatting
        run: npm run format:check

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same skip as `checks`: a content republish rebuilds code that already passed on push.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No libvips here: bundler-audit reads the lockfile and never loads the app, so this job
      # skips the slowest step in the workflow.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: web
          bundler-cache: true

      # This app parses untrusted content at build time (nokogiri, redcarpet, sanitize) and its
      # Worker exposes a public POST, so it wants the same CVE gate the api has always had.
      - name: bundler-audit (Ruby dependency CVEs)
        run: bundle exec bundle-audit check --update

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc

      # --omit=dev mirrors what the deploy job installs, so this scans what actually ships: Turbo,
      # Stimulus and Web Awesome reach every visitor's browser, satori and resvg run in the Worker,
      # and Pagefind ships wasm to anyone who searches.
      #
      # ⚠️ Blocking, like bundler-audit above. It was `continue-on-error` while wrangler's
      # miniflare → undici chain kept a high advisory permanently open — but that suppressed the
      # six dependencies that DO ship along with the one that doesn't, which is the failure mode
      # this step exists to prevent. Keeping it green is a dependency bump, not a flag.
      #
      # ⚠️ If it goes red over tooling again: `wrangler` and `@cloudflare/vitest-pool-workers`
      # must be bumped **together** — the pool exact-pins wrangler and miniflare, so npm dedupes
      # a lone `npm update wrangler` straight back to the pinned version and nothing moves.
      - name: npm audit (JS dependency CVEs)
        run: npm audit --omit=dev --audit-level=high

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, security]
    # always() so a checks failure still notifies; skipped on the dispatch/manual triggers, where
    # checks didn't run.
    if: ${{ always() && github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch' }}

    steps:
      # This job only posts to Slack; the checkout exists solely so the local composite actions
      # below resolve. Fetch just .github rather than the whole tree.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (success)
        if: ${{ needs.checks.result == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "good"
          fallback: "Web checks passed on ${{ env.BRANCH_NAME }}"

      - name: Notify Slack (failure)
        if: ${{ needs.checks.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "Web checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks, security]
    concurrency: deploy-kona-web
    # Deploy on a push to main, a Contentful publish, or a manual rebuild; never on PRs or other
    # branches. workflow_dispatch is restricted to main so a manual run can't ship a feature branch
    # to the single production Worker (run it from another branch and it's a harmless no-op: checks
    # are skipped and this guard blocks the deploy). The [skip deploy] / [no deploy] escape hatch
    # only applies to pushes (a dispatch/manual run has no commit). The result guards let the deploy
    # run when a dependency is *skipped* (a content dispatch or manual run, where neither checks nor
    # security runs) as well as when it *succeeds* (a code push) — but not when it fails;
    # !cancelled() is what lets this evaluate past a skipped dependency.
    #
    # ⚠️ Both `needs` must be named here. `!cancelled()` replaces the implicit "all needs succeeded"
    # gate, so a dependency this expression doesn't mention isn't gating anything — `security` was
    # unlisted, which silently made the CVE scan non-blocking for the deploy it exists to block.
    if: >-
      !cancelled() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]')))

    defaults:
      run:
        working-directory: web

    # The production build needs none of the test toolchain; the Gemfile groups it so this can
    # skip it, mirroring `npm ci --omit=dev` below.
    # ⚠️ Job-level, NOT on the setup-ruby step. Scoped to that step it only skips the *install*;
    # `bundle exec rake build` further down then materializes the full lockfile, doesn't find the
    # gems that were never installed, and fails the deploy with Bundler::GemNotFound.
    env:
      BUNDLE_WITHOUT: development:test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: web
          bundler-cache: true

      # One of the slower steps here, though it moves a lot with the apt mirror: measured at 13s
      # and at 48s in `deploy` on different runs, against ~16s for the site build itself. That
      # ratio is why moving blurhash generation into the api to drop this install was considered
      # and dropped — it wouldn't buy back meaningful wall-clock. libvips isn't on the runner
      # image, so the whole tree is downloaded fresh: `libvips` is a *virtual* package provided
      # by libvips42t64, which pulls ~33 direct dependencies (ImageMagick, poppler, librsvg,
      # heif, jxl...). libvips42t64 itself declares no Recommends, but everything underneath it
      # does, and apt installs recommends by default — hence --no-install-recommends. Keep the
      # virtual name rather than libvips42t64: it survives Ubuntu's package renames (the t64
      # suffix is itself one).
      # ⚠️ Needed in BOTH jobs. web/lib/helpers/image_helpers.rb requires 'vips' at the top
      # level, so rspec can't even load the helper without it — the specs stubbing Vips::Image
      # doesn't help.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --omit=dev: the deploy only needs the build/deploy tools (esbuild + its bundle imports,
      # pagefind, wrangler — all in `dependencies`), NOT the test/lint toolchain (vitest +
      # workerd, typescript, stylelint, prettier — all devDependencies). Skipping those cuts the
      # install noticeably. The `checks` job still runs a full `npm ci` since it needs them.
      - name: Install npm dependencies
        run: npm ci --omit=dev
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # (There's deliberately no "deploy starting" notification here, unlike api.yml. A Contentful
      # publish dispatches this workflow, so deploys are frequent and each one already posts on
      # activation and again once the edge cache is purged; a third message per publish was noise.
      # Nothing keys off it — a failure at any point still notifies below.)
      #
      # rake build = import (Contentful/icons/standard-site) -> middleman build -> rename
      # _redirects/_headers -> pagefind. It does NOT run tests (those are the `checks` job's job,
      # which gates deploys on code pushes). Tokens come from *secrets* (no hostnames live in this
      # file). DEPLOY_CONTEXT=production makes it a real production build (canonicals/feeds/og from
      # URL, the analytics snippet, etc.).
      - name: Build the site
        run: bundle exec rake build
        env:
          DEPLOY_CONTEXT: production
          CONTENTFUL_SPACE: ${{ secrets.CONTENTFUL_SPACE }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
          KONA_API_URL: ${{ secrets.KONA_API_URL }}
          URL: ${{ secrets.URL }}
          IMAGES_URL: ${{ secrets.IMAGES_URL }}
          # ⚠️ REQUIRED, and setting it asserts the api's R2 image mirror is populated — asset
          # URLs get their host swapped to it and 404 until the objects exist. An empty secret is
          # NOT a rollback: the zone allowlists only the mirror as a Transformations source
          # (*.ctfassets.net deliberately isn't), so an unset value 403s every image on the site.
          IMAGE_HOST: ${{ secrets.IMAGE_HOST }}
          PLAUSIBLE_SCRIPT_URL: ${{ secrets.PLAUSIBLE_SCRIPT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # ⚠️ A repo *variable*, not a secret — and note an unset one interpolates to an EMPTY
          # STRING, not an absent env var, so anything read here must treat blank as unset.
          # Unset, publish dates fall back to each reader's own browser timezone, so the "New"
          # badge flips at a different instant per reader.
          TIME_ZONE: ${{ vars.TIME_ZONE }}

      # keep_vars:true + no `routes` in wrangler.jsonc means this never clobbers the dashboard
      # vars/secrets or the www custom domain. Runs non-interactively, so the drift prompt doesn't
      # apply. Uploads build/ (assets.directory).
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ⚠️ Announced BEFORE the purge below, deliberately. `wrangler deploy` returns once the new
      # version is activated, so the site is live at this point — the purge only stops the edge
      # serving *stale* copies, and its 30s propagation sleep would otherwise pad this ping by half
      # a minute past the thing it's reporting. Keep it here; if a step is ever added that the site
      # genuinely isn't live without, this moves back below it.
      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ secrets.URL }}|successful> :rocket:"
          color: "good"
          fallback: "Web deploy successful"

      # wrangler deploy doesn't purge Cloudflare's edge cache, so without this the edge keeps
      # serving pre-deploy HTML/feeds (cf-cache-status: HIT → stale 304s) until the entries age
      # out. Every asset-layer response is tagged `Cache-Tag: site` (a host-scoped zone Cache
      # Response Rule — root CLAUDE.md); purging just that tag evicts the site's pages/feeds while
      # leaving image transformations (/cdn-cgi/image/*, never tagged) intact. The same rule's
      # second branch tags the Contentful-backed widget fragments on the api host, so this also
      # evicts those — that's deliberate, since a Contentful publish dispatches this workflow and
      # they'd otherwise serve pre-edit content; the live-data widgets carry no `site` tag and
      # survive.
      #
      # ⚠️ Purge ONLY the `site` tag. Widget fragments also carry a `widgets` tag (a second zone
      # Cache Response Rule) — that one is a MANUAL lever and must never be added here. A purge
      # drops a fragment's stale-while-revalidate / stale-if-error copies along with the fresh one,
      # and those are what keep the live-data widgets rendering through a fly outage; since a
      # Contentful publish dispatches this workflow, adding `widgets` would mean a publish landing
      # mid-outage collapses every widget site-wide. Root CLAUDE.md has the full reasoning.
      # --fail-with-body → red CI if the purge 4xxs. Reuses CLOUDFLARE_API_TOKEN, which now also
      # carries the Zone → Cache Purge permission.
      #
      # --retry 3 --retry-all-errors rides out a transient blip (5xx, connection reset, DNS) rather
      # than leaving content pinned at the edge until the next deploy over something that would
      # have worked a second later. --retry-all-errors is the load-bearing half: plain --retry
      # covers transport errors and a few 5xx, but NOT the 4xx/5xx that --fail-with-body turns into
      # a non-zero exit, which is most of what we'd want to retry here. It deliberately does not
      # paper over a bad token — a 403 retries three times, still fails the step, and still fires
      # the "purge failed" notification below. Moving this into the api as a retrying Sidekiq job
      # was considered; it buys the same transient resilience for a zone-scoped Cloudflare token on
      # the api and a 24h-later Bugsnag report in place of a loud, immediate CI failure.
      #
      # ⚠️ The sleep comes FIRST, and there is deliberately only one purge. `wrangler deploy`
      # returns at activation, but propagation across PoPs takes a few seconds — and a request
      # served by a not-yet-updated PoP right after a purge re-caches OLD content, which, since
      # deploys don't self-invalidate at the edge, stays pinned until the NEXT deploy's purge.
      # Purging only once propagation has settled is what makes that race impossible. This used to
      # purge immediately and then again after the sleep; the second call was the one doing the
      # real work, and the first bought nothing the second didn't also cover.
      # The cost is that the edge may serve the previous copy for the length of the sleep. That's
      # the right trade: it's bounded and self-correcting, whereas a re-pin lasts until the next
      # deploy. Nothing waits on this — the success ping above has already gone out.
      #
      # ⚠️ The verification below is the load-bearing half, because the API call above cannot fail
      # for the thing most likely to go wrong. A purge for a tag that matches NOTHING — because the
      # Cache Response Rule was disabled, or names a hostname that was typed by hand and never
      # validated, which has already happened once — returns 200 success. Combined with an edge TTL
      # that ignores Cache-Control for a year, that leaves pages pinned essentially forever while
      # CI stays green. Nothing else in the repo would notice.
      #
      # `age` is the signal, not cf-cache-status. A surviving entry carries the age it accumulated
      # since it was cached, which is at minimum the interval since the previous deploy; an evicted
      # one comes back with no age at all, or a tiny one if another visitor repopulated it in the
      # seconds since. That asymmetry is what makes this robust rather than racy — a repopulation
      # can only ever produce a *small* age, which is the passing case either way. A missing header
      # (uncached / DYNAMIC) passes too: the point is to catch a stale copy surviving, not to
      # assert the page is cacheable.
      #
      # ⚠️ The three values arrive through `env:`, not `${{ }}` inside the script. `${{ }}` splices
      # into the script's *source*, which puts the token in the runner's process argv and would let
      # a secret containing shell metacharacters run as code — the same hazard
      # .github/actions/ci-context avoids for commit messages.
      - name: Purge Cloudflare edge cache (tag "site")
        id: purge
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ secrets.URL }}
        run: |
          set -euo pipefail
          sleep 30
          curl -sS --fail-with-body --retry 3 --retry-all-errors -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"tags":["site"]}'

          # Let the eviction propagate before asking a PoP what it has.
          sleep 10
          # No path appended: URL may or may not carry a trailing slash (full_url overwrites the
          # path, so the Ruby side never had to care), and "<url>//" is a different cache entry.
          headers=$(curl -sS -D - -o /dev/null --retry 3 --retry-all-errors "$SITE_URL")
          age=$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "age:" { print $2; exit }')
          status=$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "cf-cache-status:" { print $2; exit }')
          echo "After the purge: cf-cache-status=${status:-none} age=${age:-none}"

          if [ -n "$age" ] && [ "$age" -gt 60 ] 2>/dev/null; then
            echo "::error::The edge served a copy ${age}s old moments after the purge, so the purge matched nothing. Check that the zone's Cache Response Rule is enabled and that its hostnames match the DNS records exactly, then purge manually."
            exit 1
          fi

      # Not redundant with "deploy successful" above — it carries the half that message can't.
      # That one fires at activation, when the edge may still be handing out the previous copy;
      # this one means the stale copies are gone and every PoP now serves the new build. Blue
      # rather than green, deliberately: it's a follow-up to the deploy, not a second success, and
      # colouring it `good` would make every deploy look like it succeeded twice.
      - name: Notify Slack (cache purged)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web cache purge <${{ secrets.URL }}|successful> :broom:"
          color: "#439FE0"
          fallback: "Web cache purge successful"

      # Its own message, because the success ping has already gone out by now and a bare "deploy
      # failed" after "deploy successful" would read as a contradiction and send you looking in
      # the wrong place. What actually happened is narrower: the site is live, but the edge may
      # keep serving the previous copy — and since deploys don't self-invalidate, that stays
      # pinned until the next deploy purges it, so it wants a manual purge. `warning` rather than
      # `danger` is what carries that "partly worked" nuance now that the text is terse.
      # Covers both halves of the step above: the API call erroring, and the verification finding
      # the purge matched nothing. The run log says which, and the consequence is the same either
      # way.
      - name: Notify Slack (purge failed)
        if: failure() && steps.purge.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web cache purge <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "warning"
          fallback: "Web cache purge failed"

      # Everything up to and including the deploy. Scoped off the purge so the two can't both
      # fire: steps.purge.outcome is '' when the step never ran, so this still covers an earlier
      # failure.
      - name: Notify Slack (deploy failed)
        if: failure() && steps.purge.outcome != 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "Web deploy failed"
