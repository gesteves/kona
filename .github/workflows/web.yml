name: "Web"

# Builds and deploys the Middleman static site to the kona-web Cloudflare Worker.
#
# Triggers:
#   - push / PR touching web/**  -> item 1: only rebuild when the web app actually changed
#     (an api/-only or og/-only change never runs this workflow).
#   - repository_dispatch: contentful-publish -> item 2: kona-api fires this when content is
#     published/unpublished in Contentful (see api/app/jobs/site_build_job.rb).
on:
  push:
    branches: ["*"]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  repository_dispatch:
    types: [contentful-publish]

# Coalesce rapid pushes / content publishes: a newer run cancels the in-flight one so we only
# build the latest. Safe mid-deploy — wrangler activates the new Worker version only at the very
# end, so a cancelled deploy leaves the current version live.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Ruby tests
        run: bundle exec rake test

      - name: Worker tests
        run: npm test

      - name: Typecheck the Worker
        run: npm run check

      - name: Lint stylesheets
        run: npm run lint:scss

      - name: Check formatting
        run: npm run format:check

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    needs: [checks]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (failure)
        if: ${{ needs.checks.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "Web checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [checks]
    concurrency: deploy-kona-web
    # Deploy on a push to main OR a Contentful publish; never on PRs or other branches. The
    # [skip deploy] / [no deploy] escape hatch only applies to pushes (a dispatch has no commit).
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]'))

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Notify Slack (deploy starting)
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy starting :hourglass_flowing_sand:"
          color: "#439FE0"
          fallback: "Web deploy starting"

      # rake build = test -> import (Contentful/icons/standard-site) -> middleman build ->
      # rename _redirects/_headers -> pagefind. Hostnames come from repo *variables*, tokens from
      # *secrets* (no hostnames live in this file). DEPLOY_CONTEXT=production makes it a real
      # production build (canonicals/feeds/og from URL, the analytics snippet, etc.).
      - name: Build the site
        run: bundle exec rake build
        env:
          DEPLOY_CONTEXT: production
          CONTENTFUL_SPACE: ${{ secrets.CONTENTFUL_SPACE }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
          KONA_API_URL: ${{ secrets.KONA_API_URL }}
          URL: ${{ secrets.URL }}
          IMAGES_URL: ${{ secrets.IMAGES_URL }}
          PLAUSIBLE_SCRIPT_URL: ${{ secrets.PLAUSIBLE_SCRIPT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      # keep_vars:true + no `routes` in wrangler.jsonc means this never clobbers the dashboard
      # vars/secrets or the www custom domain. Runs non-interactively, so the drift prompt doesn't
      # apply. Uploads build/ (assets.directory).
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ secrets.URL }}|successful> :rocket:"
          color: "good"
          fallback: "Web deploy successful"

      - name: Notify Slack (deploy failed)
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "Web deploy failed"
