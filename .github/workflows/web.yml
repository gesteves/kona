name: "Web"

# Builds the Middleman static site and deploys it to the kona-web Cloudflare Worker.
#
# Triggers:
#   - A push to main, or a PR that touches web/** -> item 1: build again only when the web app
#     changes. A change to api/ only, or to utilities/ only, does not run this workflow.
#     ⚠️ `push` applies to main only, on purpose. With ["*"], each push to a branch with an open
#     PR ran `checks` two times: one time for the push (refs/heads/<branch>) and one time for the
#     PR (refs/pull/N/merge). These are different `github.ref` values, thus the concurrency group
#     below cannot make them one. The pull_request trigger covers the work on a branch, and this
#     trigger covers main.
#   - repository_dispatch: contentful-publish -> item 2: kona-api sends this when a user
#     publishes or unpublishes content in Contentful (refer to api/app/jobs/site_build_job.rb).
#   - repository_dispatch: api-build -> the same job. A POST to the /api/build endpoint of the
#     api sends it, and that endpoint needs a bearer token. It is a "build now" command for a
#     script or for automation. The two types run in the same way here. They are different only
#     to let the Slack notification say which one started the deploy (refer to
#     .github/actions/ci-context/action.yml).
#   - workflow_dispatch -> the manual "Run workflow" button, from main. This builds on demand.
#     The build always gets the Contentful drafts (a preview token and `preview: true`) and
#     renders each draft to /id/<entry-id>/, which is noindex and in no list. But only a publish,
#     an unpublish, or a delete starts a build. Thus this button shows a draft that is not
#     complete, and you do not publish it.
#
# `paths` also includes the composite actions. The jobs below use them, thus a change to one of
# them must run this workflow. Without the entry, such a change would run no CI at all.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/**'
  repository_dispatch:
    types: [contentful-publish, api-build]
  workflow_dispatch:

# No job writes to the repository. The deploy and the cache purge use CLOUDFLARE_API_TOKEN, and
# Slack uses its webhook. They never use GITHUB_TOKEN. Set GITHUB_TOKEN to read-only here. Do not
# use the default value of the repository.
permissions:
  contents: read

# Make one run from a group of quick pushes or content publishes: a new run stops the run in
# progress, thus the workflow builds only the most recent content. This is safe during a deploy,
# because wrangler activates the new Worker version only at the end. Thus a deploy that stops
# keeps the current version live.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This does not run for a Contentful publish (repository_dispatch) or for a manual build
    # (workflow_dispatch). Both build the code that is already on main with the current content.
    # Thus there is nothing new to test, to lint, or to typecheck, and the code on main passed the
    # checks at the push. This keeps a content publish and an on-demand preview build off the test
    # path, which takes approximately one minute.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: web
          bundler-cache: true

      # This is one of the slower steps, but its time changes with the apt mirror. Different runs
      # of `deploy` measured 13s and 48s, against approximately 16s for the site build. That ratio
      # is why the blurhash generation stays here: a move into the api would remove this install
      # but would not save much time. libvips is not on the runner image, thus apt downloads the
      # full tree. `libvips` is a *virtual* package that libvips42t64 supplies, and that package
      # needs approximately 33 direct dependencies (ImageMagick, poppler, librsvg, heif, jxl, and
      # more). libvips42t64 declares no Recommends, but the packages below it do, and apt installs
      # the recommends by default. Thus this uses --no-install-recommends. Keep the virtual name
      # and do not use libvips42t64: the virtual name stays correct through the Ubuntu package
      # renames (the t64 suffix is one of those renames).
      # ⚠️ BOTH jobs need this. web/lib/helpers/image_helpers.rb requires 'vips' at the top level.
      # Thus rspec cannot load the helper without it, and the specs that stub Vips::Image do not
      # help.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # Use rspec directly, NOT `rake test`. The Rakefile loads the data layer, which reads the
      # live Contentful schema at boot and thus needs credentials and a network. rspec loads only
      # the specs, and contentful_spec stubs that client. Thus the suite runs in CI with no
      # credentials.
      - name: Ruby tests
        run: bundle exec rspec

      - name: Worker tests
        run: npm test

      - name: Typecheck the Worker
        run: npm run check

      - name: RuboCop (style)
        run: bundle exec rubocop --no-color

      # This covers source/javascripts/** and test/browser/**, which `npm run check` does not
      # reach, because the two tsconfig files include only src/ and test/*.ts. Refer to
      # eslint.config.mjs.
      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint stylesheets
        run: npm run lint:scss

      - name: Check formatting
        run: npm run format:check

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same rule as `checks`: a content publish builds code that already passed at the push.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # There is no libvips here. bundler-audit reads the lockfile and never loads the app, thus
      # this job does not do the slowest step in the workflow.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: web
          bundler-cache: true

      # This app parses content that it does not control at build time (nokogiri, redcarpet,
      # sanitize), and its Worker has a public POST. Thus it needs the same CVE check as the api.
      - name: bundler-audit (Ruby dependency CVEs)
        run: bundle exec bundle-audit check --update

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc

      # --omit=dev is the same as the install in the deploy job. Thus this scans the code that
      # goes to production: Turbo, Stimulus, and Web Awesome go to the browser of each visitor,
      # satori and resvg run in the Worker, and Pagefind sends wasm to each person who searches.
      #
      # ⚠️ This step stops the workflow on a failure, as bundler-audit above does. With
      # `continue-on-error`, the miniflare → undici chain of wrangler kept one high advisory open,
      # and that hid the six dependencies that DO go to production together with the one that does
      # not. That is the failure that this step stops. To keep this step green, increase a
      # dependency version. Do not add a flag.
      #
      # ⚠️ If this step becomes red because of the tools again, increase the versions of
      # `wrangler` and `@cloudflare/vitest-pool-workers` **together**. The pool pins the exact
      # versions of wrangler and miniflare. Thus npm moves an `npm update wrangler` alone back to
      # the pinned version, and nothing changes.
      - name: npm audit (JS dependency CVEs)
        run: npm audit --omit=dev --audit-level=high

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, security]
    # Use always(), thus a failure in checks still sends a message. This does not run for the
    # dispatch trigger or the manual trigger, where checks did not run.
    if: ${{ always() && github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch' }}

    steps:
      # This job only sends a message to Slack. The checkout is here only to make the local
      # composite actions below available. Get .github only, and not the full tree.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (success)
        if: ${{ needs.checks.result == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "good"
          fallback: "Web checks passed on ${{ env.BRANCH_NAME }}"

      - name: Notify Slack (failure)
        if: ${{ needs.checks.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "Web checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [checks, security]
    concurrency: deploy-kona-web
    # Deploy on a push to main, on a Contentful publish, or on a manual build. Never deploy on a
    # PR or on another branch. workflow_dispatch applies to main only, thus a manual run cannot
    # send a feature branch to the one production Worker. A run from another branch does nothing
    # and causes no damage: the checks do not run and this condition stops the deploy. The
    # [skip deploy] and [no deploy] text applies only to a push, because a dispatch run or a
    # manual run has no commit. The result conditions let the deploy run when a dependency is
    # *skipped* (a content dispatch or a manual run, where neither checks nor security runs) and
    # also when it is *successful* (a code push). They do not let it run when a dependency fails.
    # !cancelled() is what lets this expression continue past a dependency that did not run.
    #
    # ⚠️ Name both `needs` here. `!cancelled()` replaces the implicit "all needs are successful"
    # condition. Thus a dependency that this expression does not name controls nothing. The
    # expression did not name `security`, which let the CVE scan permit the deploy that it exists
    # to stop.
    if: >-
      !cancelled() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]')))

    defaults:
      run:
        working-directory: web

    # The production build needs none of the test tools. The Gemfile puts them in a group, thus
    # this can omit them, as `npm ci --omit=dev` below does.
    # ⚠️ Put this at the job level, NOT on the setup-ruby step. On that step it omits only the
    # *install*. `bundle exec rake build` below then reads the full lockfile, does not find the
    # gems that no step installed, and stops the deploy with Bundler::GemNotFound.
    env:
      BUNDLE_WITHOUT: development:test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: web
          bundler-cache: true

      # This is one of the slower steps, but its time changes with the apt mirror. Different runs
      # of `deploy` measured 13s and 48s, against approximately 16s for the site build. That ratio
      # is why the blurhash generation stays here: a move into the api would remove this install
      # but would not save much time. libvips is not on the runner image, thus apt downloads the
      # full tree. `libvips` is a *virtual* package that libvips42t64 supplies, and that package
      # needs approximately 33 direct dependencies (ImageMagick, poppler, librsvg, heif, jxl, and
      # more). libvips42t64 declares no Recommends, but the packages below it do, and apt installs
      # the recommends by default. Thus this uses --no-install-recommends. Keep the virtual name
      # and do not use libvips42t64: the virtual name stays correct through the Ubuntu package
      # renames (the t64 suffix is one of those renames).
      # ⚠️ BOTH jobs need this. web/lib/helpers/image_helpers.rb requires 'vips' at the top level.
      # Thus rspec cannot load the helper without it, and the specs that stub Vips::Image do not
      # help.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --omit=dev: the deploy needs only the build and deploy tools (esbuild and its bundle
      # imports, pagefind, and wrangler, which are all in `dependencies`). It does not need the
      # test and lint tools (vitest, workerd, typescript, stylelint, and prettier, which are all
      # devDependencies). Without those, the install is much faster. The `checks` job still does a
      # full `npm ci`, because it needs them.
      - name: Install npm dependencies
        run: npm ci --omit=dev
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # (There is no "deploy starting" message here, on purpose, and api.yml is different. A
      # Contentful publish starts this workflow, thus deploys are frequent. Each deploy already
      # sends a message at the activation and again after the purge of the edge cache. A third
      # message for each publish was too much. Nothing depends on it, and a failure at any point
      # still sends a message below.)
      #
      # rake build = import (Contentful, icons, standard-site) -> middleman build -> rename
      # _redirects and _headers -> pagefind. It does NOT run the tests. The `checks` job runs them,
      # and it controls the deploy on a code push. The tokens come from *secrets*, and no hostname
      # is in this file. DEPLOY_CONTEXT=production makes a true production build: the canonicals,
      # the feeds, and the og data come from URL, and the analytics snippet is present.
      - name: Build the site
        run: bundle exec rake build
        env:
          DEPLOY_CONTEXT: production
          CONTENTFUL_SPACE: ${{ secrets.CONTENTFUL_SPACE }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
          KONA_API_URL: ${{ secrets.KONA_API_URL }}
          URL: ${{ secrets.URL }}
          IMAGES_URL: ${{ secrets.IMAGES_URL }}
          # ⚠️ This is NECESSARY. A value here says that the R2 image mirror of the api is
          # complete. The build changes the host of each asset URL to it, and each URL 404s until
          # the objects exist. An empty secret is NOT a way to go back: the zone permits only the
          # mirror as a Transformations source, and it does not permit *.ctfassets.net, on
          # purpose. Thus a value that is not set 403s each image on the site.
          IMAGE_HOST: ${{ secrets.IMAGE_HOST }}
          PLAUSIBLE_SCRIPT_URL: ${{ secrets.PLAUSIBLE_SCRIPT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # ⚠️ This is a repository *variable*, not a secret. A variable with no value becomes an
          # EMPTY STRING, and not an absent env var. Thus each reader of this value must count a
          # blank value as no value. With no value, a publish date uses the browser timezone of
          # each reader, and the "New" badge changes at a different moment for each reader.
          TIME_ZONE: ${{ vars.TIME_ZONE }}

      # keep_vars:true, and wrangler.jsonc has no `routes`. Thus this never replaces the vars and
      # secrets in the dashboard or the www custom domain. It runs with no user, thus the drift
      # question does not occur. It uploads build/ (assets.directory).
      # The HTML only, thus the artifact stays small. The accessibility job below reads it.
      # ⚠️ This uploads and nothing more. The check itself is a SEPARATE job, thus it cannot delay
      # or stop this deploy.
      - name: Save the pages for the accessibility check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-html
          path: web/build/**/*.html
          retention-days: 1
          if-no-files-found: warn

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ⚠️ This message goes out BEFORE the purge below, on purpose. `wrangler deploy` returns
      # after the activation of the new version, thus the site is live at this point. The purge
      # only stops the edge from old copies, and its 30s wait for propagation would delay this
      # message by half a minute after the event that it reports. Keep the message here. If
      # someone adds a step that the site is not live without, move this message below that step.
      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ secrets.URL }}|successful> :rocket:"
          color: "good"
          fallback: "Web deploy successful"

      # wrangler deploy does not purge the Cloudflare edge cache. Without this step, the edge
      # continues to serve the HTML and the feeds from before the deploy (cf-cache-status: HIT,
      # then old 304s) until the entries expire. A zone Cache Response Rule for this host gives
      # each asset-layer response the tag `Cache-Tag: site` (refer to the root CLAUDE.md). A purge
      # of that tag alone removes the pages and the feeds of the site, and it keeps the image
      # transformations (/cdn-cgi/image/*, which have no tag). The second part of the same rule
      # gives the tag to the Contentful widget fragments on the api host, thus this purge also
      # removes those. That is correct, because a Contentful publish starts this workflow and
      # those fragments would show content from before the edit. The live-data widgets have no
      # `site` tag and stay in the cache.
      #
      # ⚠️ Purge ONLY the `site` tag. The widget fragments also have a `widgets` tag from a second
      # zone Cache Response Rule. That tag is a MANUAL control, and it must never go here. A purge
      # removes the stale-while-revalidate and stale-if-error copies of a fragment with the fresh
      # copy, and those copies keep the live-data widgets in operation through a fly failure. A
      # Contentful publish starts this workflow. Thus with `widgets` here, a publish during a
      # failure would remove each widget on the full site. The root CLAUDE.md has the full
      # explanation.
      # --fail-with-body makes the CI red if the purge gives a 4xx. It uses CLOUDFLARE_API_TOKEN,
      # which now also has the Zone → Cache Purge permission.
      #
      # --retry 3 --retry-all-errors continues through a temporary problem (a 5xx, a connection
      # reset, or DNS). Without it, the content stays at the edge until the next deploy because of
      # a problem that would go away in one second. --retry-all-errors is the important half:
      # --retry alone covers the transport errors and some 5xx errors, but NOT the 4xx and 5xx
      # errors that --fail-with-body makes into a non-zero exit, and those are most of what we
      # want to try again. It does not hide a bad token, on purpose. A 403 tries three times,
      # still fails the step, and still sends the "purge failed" message below. A move of this
      # step into the api as a Sidekiq job with retries gives the same protection from a temporary
      # problem, but it needs a zone Cloudflare token on the api, and it gives a Bugsnag report 24
      # hours later in place of an immediate CI failure.
      #
      # ⚠️ The sleep comes FIRST, and there is only one purge, on purpose. `wrangler deploy`
      # returns at the activation, but the propagation to all the PoPs takes some seconds. A
      # request that a PoP with the old version answers immediately after a purge puts OLD content
      # in the cache again. A deploy does not invalidate the edge by itself, thus that content
      # stays until the purge of the NEXT deploy. A purge after the propagation is complete makes
      # that race impossible. A first purge before the sleep gives nothing that the purge after
      # the sleep does not also give.
      # The cost is that the edge can serve the previous copy for the length of the sleep. That is
      # the correct choice: the time is short and the condition corrects itself, but old content
      # in the cache again stays until the next deploy. Nothing waits for this step, because the
      # success message above already went out.
      #
      # ⚠️ The check below is the important half, because the API call above cannot fail for the
      # most probable problem. A purge for a tag that matches NOTHING returns 200 success. This
      # occurs when the Cache Response Rule is off, or when it names a hostname that someone typed
      # by hand and no one checked, which has already occurred one time. With an edge TTL that
      # ignores Cache-Control for a year, the pages then stay in the cache for almost all time
      # while the CI stays green. Nothing else in the repo would find this.
      #
      # `age` is the signal, not cf-cache-status. An entry that stays has the age that it collected
      # since it went into the cache, which is at minimum the time since the previous deploy. An
      # entry that goes away comes back with no age, or with a small age if another visitor put it
      # in the cache again in the seconds after the purge. That difference makes this check
      # dependable and not a race: a new entry can give only a *small* age, which is the pass
      # condition in both conditions. A header that is absent (no cache, or DYNAMIC) also passes.
      # The purpose is to find an old copy that stays, and not to say that the page is cacheable.
      #
      # ⚠️ The three values come through `env:`, and not through `${{ }}` in the script. `${{ }}`
      # puts the value into the *source* of the script. That puts the token in the process argv of
      # the runner, and it would let a secret with shell metacharacters run as code. This is the
      # same danger that .github/actions/ci-context prevents for a commit message.
      - name: Purge Cloudflare edge cache (tag "site")
        id: purge
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ secrets.URL }}
        run: |
          set -euo pipefail
          sleep 30
          curl -sS --fail-with-body --retry 3 --retry-all-errors -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"tags":["site"]}'

          # Wait for the propagation of the removal before you ask a PoP what it has.
          sleep 10
          # Do not add a path. URL can have a slash at the end or no slash at the end. full_url
          # replaces the path, thus the Ruby code does not need to know. And "<url>//" is a
          # different cache entry.
          headers=$(curl -sS -D - -o /dev/null --retry 3 --retry-all-errors "$SITE_URL")
          age=$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "age:" { print $2; exit }')
          status=$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "cf-cache-status:" { print $2; exit }')
          echo "After the purge: cf-cache-status=${status:-none} age=${age:-none}"

          if [ -n "$age" ] && [ "$age" -gt 60 ] 2>/dev/null; then
            echo "::error::The edge served a copy ${age}s old moments after the purge, so the purge matched nothing. Check that the zone's Cache Response Rule is enabled and that its hostnames match the DNS records exactly, then purge manually."
            exit 1
          fi

      # This message is not the same as "deploy successful" above. It gives the half that the
      # other message cannot give. The other message goes out at the activation, when the edge can
      # still give the previous copy. This message means that the old copies are gone and that
      # each PoP now serves the new build. The color is blue and not green, on purpose: this is a
      # second part of the deploy, and not a second success. The color `good` would make each
      # deploy look like two successes.
      - name: Notify Slack (cache purged)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web cache purge <${{ secrets.URL }}|successful> :broom:"
          color: "#439FE0"
          fallback: "Web cache purge successful"

      # This has its own message, because the success message already went out. A plain "deploy
      # failed" after "deploy successful" would look like a contradiction and would send you to
      # the wrong place. The true condition is smaller: the site is live, but the edge can continue
      # to give the previous copy. A deploy does not invalidate the edge by itself, thus that copy
      # stays until the purge of the next deploy. Thus it needs a manual purge. The color is
      # `warning` and not `danger`, which shows that one part worked, now that the text is short.
      # This covers both halves of the step above: an error in the API call, and a check that finds
      # that the purge matched nothing. The run log says which one occurred, and the result is the
      # same for both.
      - name: Notify Slack (purge failed)
        if: failure() && steps.purge.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web cache purge <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "warning"
          fallback: "Web cache purge failed"

      # This covers each step to the deploy and the deploy itself. It uses the purge result, thus
      # the two messages cannot both go out. steps.purge.outcome is '' when the step did not run,
      # thus this still covers a failure before the purge.
      - name: Notify Slack (deploy failed)
        if: failure() && steps.purge.outcome != 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "Web deploy failed"

  # The accessibility check of the pages that the deploy sent.
  #
  # ⚠️ This is a SEPARATE job, and it runs AFTER the site is live, on purpose. It can never delay a
  # deploy and it can never stop one. A Contentful publish starts this workflow, thus an
  # accessibility problem in the content must not stop a publish. The result comes to Slack, and a
  # person acts on it.
  #
  # ⚠️ It is a separate job for a second reason: it needs jsdom and axe-core, which are
  # devDependencies. The deploy job installs with `npm ci --omit=dev`, thus it does not have them.
  # This job does a full `npm ci`.
  accessibility:
    name: Accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    # A deploy that failed uploaded no pages. There is then nothing to check, and the deploy already
    # sent its own message.
    if: ${{ always() && needs.deploy.result == 'success' }}

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A full install, and not --omit=dev: the check needs jsdom and axe-core.
      - name: Install npm dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Get the pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-html
          path: web/build

      # continue-on-error, thus a violation makes this step red and the job green. The next step
      # reads the outcome and sends the message.
      - name: Run axe
        id: axe
        continue-on-error: true
        run: npm run test:a11y

      # ⚠️ On a failure only. The deploy already sends a success message, and a second one makes one
      # deploy look like two successes. `warning` is the color for "it is live and a person must
      # act". Refer to .github/actions/notify-slack.
      - name: Notify Slack (accessibility violations)
        if: ${{ steps.axe.outcome == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web accessibility check <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|found violations> :warning:"
          color: "warning"
          fallback: "Web accessibility check found violations"
