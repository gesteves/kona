name: "Web"

# Builds and deploys the Middleman static site to the kona-web Cloudflare Worker.
#
# Triggers:
#   - push to main / PR touching web/**  -> item 1: only rebuild when the web app actually
#     changed (an api/-only or contentful/-only change never runs this workflow).
#     ⚠️ `push` is scoped to main on purpose. It used to be ["*"], which meant every push to a
#     branch with an open PR ran `checks` twice — once for the push (refs/heads/<branch>) and
#     once for the PR (refs/pull/N/merge). Those are different `github.ref` values, so the
#     concurrency group below never collapsed them. Work on a branch is covered by the
#     pull_request trigger; main is covered here.
#   - repository_dispatch: contentful-publish -> item 2: kona-api fires this when content is
#     published/unpublished in Contentful (see api/app/jobs/site_build_job.rb).
#   - repository_dispatch: api-build -> the same job, fired by a POST to the api's /api/build
#     endpoint (bearer-gated) — a programmatic "rebuild now" for scripts and automation. Both
#     types run identically here; they're separate only so the Slack notification can say which
#     one triggered the deploy (see .github/actions/ci-context/action.yml).
#   - workflow_dispatch -> manual "Run workflow" button (from main). An on-demand rebuild:
#     the build always pulls Contentful drafts (preview token + `preview: true`) and renders
#     each to /id/<entry-id>/ (noindex, unlisted), but only publish/unpublish/delete fires a
#     build — so this is how you surface an in-progress draft without publishing it.
#
# The composite actions are in `paths` too: they're used by the jobs below, so a change to one
# of them needs to run this workflow — without the entry it would trigger no CI at all.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - '.github/actions/**'
  repository_dispatch:
    types: [contentful-publish, api-build]
  workflow_dispatch:

# No job writes to the repository — the deploy and the cache purge authenticate with
# CLOUDFLARE_API_TOKEN and Slack with its webhook, never GITHUB_TOKEN. Pin it read-only rather
# than inheriting whatever the repo-wide default happens to be.
permissions:
  contents: read

# Coalesce rapid pushes / content publishes: a newer run cancels the in-flight one so we only
# build the latest. Safe mid-deploy — wrangler activates the new Worker version only at the very
# end, so a cancelled deploy leaves the current version live.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # Skipped on a Contentful publish (repository_dispatch) and a manual rebuild
    # (workflow_dispatch): both just rebuild the code already on main against current content, so
    # there's nothing new to test/lint/typecheck — and the code on main already passed checks when
    # it was pushed. Keeps content republishes and on-demand preview rebuilds off the ~1-minute
    # test critical path.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # The slowest step in this workflow by a wide margin — measured at 19s in `checks` and 48s
      # in `deploy`, against ~12s for the actual site build. libvips isn't on the runner
      # image, so the whole tree is downloaded fresh: `libvips` is a *virtual* package provided
      # by libvips42t64, which pulls ~33 direct dependencies (ImageMagick, poppler, librsvg,
      # heif, jxl...). libvips42t64 itself declares no Recommends, but everything underneath it
      # does, and apt installs recommends by default — hence --no-install-recommends. Keep the
      # virtual name rather than libvips42t64: it survives Ubuntu's package renames (the t64
      # suffix is itself one).
      # ⚠️ Needed in BOTH jobs. web/lib/helpers/image_helpers.rb requires 'vips' at the top
      # level, so rspec can't even load the helper without it — the specs stubbing Vips::Image
      # doesn't help.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      # rspec directly, NOT `rake test`: loading the Rakefile requires the data layer, which
      # introspects the live Contentful schema at boot (needs creds/network). rspec loads only the
      # specs, and contentful_spec stubs that client, so the suite runs credential-free in CI.
      - name: Ruby tests
        run: bundle exec rspec

      - name: Worker tests
        run: npm test

      - name: Typecheck the Worker
        run: npm run check

      - name: Lint stylesheets
        run: npm run lint:scss

      - name: Check formatting
        run: npm run format:check

  notify-checks:
    name: Notify checks result
    runs-on: ubuntu-latest
    needs: [checks]
    # always() so a checks failure still notifies; skipped on the dispatch/manual triggers, where
    # checks didn't run.
    if: ${{ always() && github.event_name != 'repository_dispatch' && github.event_name != 'workflow_dispatch' }}

    steps:
      # This job only posts to Slack; the checkout exists solely so the local composite actions
      # below resolve. Fetch just .github rather than the whole tree.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Notify Slack (success)
        if: ${{ needs.checks.result == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks passed on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "good"
          fallback: "Web checks passed on ${{ env.BRANCH_NAME }}"

      - name: Notify Slack (failure)
        if: ${{ needs.checks.result == 'failure' }}
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web checks <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> on <${{ env.BRANCH_URL }}|`${{ env.BRANCH_NAME }}`>"
          color: "danger"
          fallback: "Web checks failed on ${{ env.BRANCH_NAME }}"

  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [checks]
    concurrency: deploy-kona-web
    # Deploy on a push to main, a Contentful publish, or a manual rebuild; never on PRs or other
    # branches. workflow_dispatch is restricted to main so a manual run can't ship a feature branch
    # to the single production Worker (run it from another branch and it's a harmless no-op: checks
    # are skipped and this guard blocks the deploy). The [skip deploy] / [no deploy] escape hatch
    # only applies to pushes (a dispatch/manual run has no commit). The checks-result guard lets the
    # deploy run when checks is *skipped* (a content dispatch or manual run, where checks doesn't
    # run) as well as when it *succeeds* (a code push) — but not when it fails; !cancelled() is what
    # lets this evaluate past a skipped dependency.
    if: >-
      !cancelled() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip deploy]') &&
      !contains(github.event.head_commit.message, '[no deploy]')))

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: CI context
        uses: ./.github/actions/ci-context

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # The slowest step in this workflow by a wide margin — measured at 19s in `checks` and 48s
      # in `deploy`, against ~12s for the actual site build. libvips isn't on the runner
      # image, so the whole tree is downloaded fresh: `libvips` is a *virtual* package provided
      # by libvips42t64, which pulls ~33 direct dependencies (ImageMagick, poppler, librsvg,
      # heif, jxl...). libvips42t64 itself declares no Recommends, but everything underneath it
      # does, and apt installs recommends by default — hence --no-install-recommends. Keep the
      # virtual name rather than libvips42t64: it survives Ubuntu's package renames (the t64
      # suffix is itself one).
      # ⚠️ Needed in BOTH jobs. web/lib/helpers/image_helpers.rb requires 'vips' at the top
      # level, so rspec can't even load the helper without it — the specs stubbing Vips::Image
      # doesn't help.
      - name: Install libvips (ruby-vips / blurhashes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --omit=dev: the deploy only needs the build/deploy tools (esbuild + its bundle imports,
      # pagefind, wrangler — all in `dependencies`), NOT the test/lint toolchain (vitest +
      # workerd, typescript, stylelint, prettier — all devDependencies). Skipping those cuts the
      # install noticeably. The `checks` job still runs a full `npm ci` since it needs them.
      - name: Install npm dependencies
        run: npm ci --omit=dev
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}

      - name: Notify Slack (deploy starting)
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy starting :hourglass_flowing_sand:"
          color: "#439FE0"
          fallback: "Web deploy starting"

      # rake build = import (Contentful/icons/standard-site) -> middleman build -> rename
      # _redirects/_headers -> pagefind. It does NOT run tests (those are the `checks` job's job,
      # which gates deploys on code pushes). Tokens come from *secrets* (no hostnames live in this
      # file). DEPLOY_CONTEXT=production makes it a real production build (canonicals/feeds/og from
      # URL, the analytics snippet, etc.).
      - name: Build the site
        run: bundle exec rake build
        env:
          DEPLOY_CONTEXT: production
          CONTENTFUL_SPACE: ${{ secrets.CONTENTFUL_SPACE }}
          CONTENTFUL_TOKEN: ${{ secrets.CONTENTFUL_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
          KONA_API_URL: ${{ secrets.KONA_API_URL }}
          URL: ${{ secrets.URL }}
          IMAGES_URL: ${{ secrets.IMAGES_URL }}
          PLAUSIBLE_SCRIPT_URL: ${{ secrets.PLAUSIBLE_SCRIPT_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      # keep_vars:true + no `routes` in wrangler.jsonc means this never clobbers the dashboard
      # vars/secrets or the www custom domain. Runs non-interactively, so the drift prompt doesn't
      # apply. Uploads build/ (assets.directory).
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler deploy doesn't purge Cloudflare's edge cache, so without this the edge keeps
      # serving pre-deploy HTML/feeds (cf-cache-status: HIT → stale 304s) until the entries age
      # out. Every asset-layer response is tagged `Cache-Tag: site` (a host-scoped zone Cache
      # Response Rule — root CLAUDE.md); purging just that tag evicts the site's pages/feeds while
      # leaving image transformations (/cdn-cgi/image/*, never tagged) and the api-host widget
      # cache (other host, never tagged) intact. Runs after wrangler activates the new version, so
      # the next request re-populates the edge from it. --fail-with-body → red CI if the purge 4xxs.
      # Reuses CLOUDFLARE_API_TOKEN, which now also carries the Zone → Cache Purge permission.
      #
      # Purged TWICE: wrangler returns at activation, but propagation across PoPs takes a few
      # seconds, and a request served by a not-yet-updated PoP right after the first purge would
      # re-cache OLD content — which, since deploys don't self-invalidate at the edge, would stay
      # pinned until the NEXT deploy's purge. The second pass runs after propagation has settled
      # and evicts anything the race re-pinned. Off the critical path: the new version is already
      # live, so the sleep delays nothing but this job's completion.
      - name: Purge Cloudflare edge cache (tag "site")
        run: |
          purge() {
            curl -sS --fail-with-body -X POST \
              "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"tags":["site"]}'
          }
          purge
          sleep 30
          purge

      - name: Notify Slack (deploy successful)
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ secrets.URL }}|successful> :rocket:"
          color: "good"
          fallback: "Web deploy successful"

      - name: Notify Slack (deploy failed)
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "Web deploy <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|failed> :warning:"
          color: "danger"
          fallback: "Web deploy failed"
