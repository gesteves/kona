name: "Utilities"

# Checks for the local-only tools in utilities/. Nothing here deploys — that's the whole point
# of the directory: `web.yml` and `api.yml` are path-filtered on `web/**` / `api/**`, so a change
# to a utility never builds the site, redeploys a Worker, or purges the edge cache.
#
# utilities/aqi-map/ has no test framework and doesn't warrant one, but its copy of the EPA AQI
# math is a hand-maintained duplicate of the api's, so a plain Ruby check pins it to the published
# equation. utilities/contentful/ is a set of one-off Node scripts run by hand against Contentful;
# there's nothing to check.
on:
  push:
    branches: [main]
    paths:
      - 'utilities/aqi-map/**'
      - '.github/workflows/utilities.yml'
  pull_request:
    branches: [main]
    paths:
      - 'utilities/aqi-map/**'
      - '.github/workflows/utilities.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aqi-map:
    name: AQI math check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: utilities/aqi-map

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ⚠️ working-directory has to be an input to the action. The job-level
      # `defaults.run.working-directory` above applies only to `run:` steps, so without this
      # setup-ruby looks for .ruby-version at the repo root — where there isn't one — and dies
      # with a bare ENOENT.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: utilities/aqi-map
          bundler-cache: false

      # No bundle install: the check requires only lib/epa_aqi.rb, which is plain Ruby with no
      # gem dependencies, so this stays fast and can't be broken by the Sinatra app's Gemfile.
      - name: EPA AQI golden vectors
        run: ruby spec/epa_aqi_check.rb
