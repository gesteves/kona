name: "Utilities"

# The checks for the local-only tools in utilities/. Nothing here goes to production, and that is
# the purpose of the directory: `web.yml` and `api.yml` have a path filter on `web/**` and `api/**`.
# Thus a change to a tool never builds the site, never deploys a Worker, and never purges the edge
# cache.
#
# utilities/aqi-map/ has no test framework and needs none, but its copy of the EPA AQI math is a
# copy of the code in the api that a person keeps correct. Thus a plain Ruby check compares it with
# the published equation. utilities/contentful/ is a set of Node scripts that a person runs one time
# each against Contentful, and there is nothing to check there.
on:
  push:
    branches: [main]
    paths:
      - 'utilities/aqi-map/**'
      - '.github/workflows/utilities.yml'
  pull_request:
    branches: [main]
    paths:
      - 'utilities/aqi-map/**'
      - '.github/workflows/utilities.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aqi-map:
    name: AQI math check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: utilities/aqi-map

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ⚠️ working-directory must be an input of the action. The `defaults.run.working-directory` at
      # the job level applies to a `run:` step only. Thus without this input, setup-ruby looks for
      # .ruby-version at the root of the repo, where there is none, and it stops with an ENOENT.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: utilities/aqi-map
          bundler-cache: false

      # There is no bundle install. The check needs lib/epa_aqi.rb only, which is plain Ruby with no
      # gem. Thus this step is fast, and the Gemfile of the Sinatra app cannot break it.
      - name: EPA AQI golden vectors
        run: ruby spec/epa_aqi_check.rb
