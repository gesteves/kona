name: "CI context"
description: "Populate SHORT_SHA, COMMIT_MESSAGE, COMMIT_CONTEXT, BRANCH_NAME and BRANCH_URL in the job env for Slack notifications."

runs:
  using: "composite"
  steps:
    - name: Set short SHA and branch/PR info
      shell: bash
      # ⚠️ Each value from the event payload comes through `env:` and the script below reads it as
      # "$VAR". Never put such a value in the script with `${{ }}`. A commit message and a PR title
      # are text that an attacker can write, and `${{ }}` puts them into the *source* of this
      # script. Thus a backtick or a $(…) in a commit message would run as shell in a job that also
      # holds the deploy credentials. Put each new payload value in this block.
      env:
        EVENT_NAME: ${{ github.event_name }}
        DISPATCH_TYPE: ${{ github.event.action }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_REF: ${{ github.head_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REF_NAME: ${{ github.ref_name }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # On a pull_request, GITHUB_SHA is the merge commit that GitHub makes. Nobody pushed it,
          # and nothing can reach it after the PR closes. Thus the link points at the head of the
          # PR. `pull_request.head` has only label, ref, sha, user, and repo: it has no commit
          # message. Thus the title of the PR is the only description. A read of head.commit.message
          # here gave a Slack attachment with only a sha and a hyphen, because that field is always
          # empty.
          SHA="$PR_HEAD_SHA"
          BRANCH_NAME="$PR_HEAD_REF"
          COMMIT_MESSAGE="$PR_TITLE"
          BRANCH_URL="${SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}"
        else
          SHA="$GITHUB_SHA"
          BRANCH_NAME="$REF_NAME"
          COMMIT_MESSAGE="$HEAD_COMMIT_MESSAGE"
          BRANCH_URL="${SERVER_URL}/${REPOSITORY}/tree/${REF_NAME}"
        fi

        SHORT_SHA="${SHA::8}"

        # Take the first line only, then escape each backslash and each double quote.
        # COMMIT_CONTEXT goes into the YAML `payload:` block of notify-slack, where a plain " breaks
        # the string. A plain newline would break that block and also the KEY=value writes to
        # $GITHUB_ENV below. Escape the backslashes first, or the rule would escape again each
        # backslash that the quote rule just added.
        COMMIT_MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | sed 's/\\/\\\\/g; s/"/\\"/g')"

        # COMMIT_CONTEXT is the first line of the Slack attachment. Only a push event and a PR
        # event describe a change. For the two deploy triggers that do not, the usual
        # "<sha> - <message>" gives only a hash and a hyphen. Give those a label that names the
        # cause of the deploy:
        #   repository_dispatch -> the SiteBuildJob of the api. The commit is the current state of
        #     main, thus the sha has no meaning. Remove it. DISPATCH_TYPE, which is the `event_type`
        #     of the event and which github.event.action gives, says which caller sent it:
        #     contentful-publish is a Contentful publish or unpublish, api-build is a POST to
        #     /api/build, and admin-republish is the Republish dialog of the admin UI. For a type
        #     that this code does not know, it uses the Contentful text and does not write a blank
        #     line.
        #   workflow_dispatch   -> a manual "Run workflow". The sha DOES have a meaning, because it
        #     is what the deploy sent. Keep the link and say why there is no message.
        COMMIT_LINK="<${SERVER_URL}/${REPOSITORY}/commit/${SHA}|\`${SHORT_SHA}\`>"
        case "$EVENT_NAME" in
          repository_dispatch)
            case "$DISPATCH_TYPE" in
              api-build)       COMMIT_CONTEXT="Rebuild triggered via the API" ;;
              admin-republish) COMMIT_CONTEXT="Republished from the admin" ;;
              *)               COMMIT_CONTEXT="Content update — published in Contentful" ;;
            esac
            ;;
          workflow_dispatch)   COMMIT_CONTEXT="Manual rebuild of ${COMMIT_LINK}" ;;
          *)                   COMMIT_CONTEXT="${COMMIT_LINK} - ${COMMIT_MESSAGE}" ;;
        esac

        {
          echo "SHORT_SHA=${SHORT_SHA}"
          echo "BRANCH_NAME=${BRANCH_NAME}"
          echo "COMMIT_MESSAGE=${COMMIT_MESSAGE}"
          echo "BRANCH_URL=${BRANCH_URL}"
          echo "COMMIT_CONTEXT=${COMMIT_CONTEXT}"
        } >> "$GITHUB_ENV"
