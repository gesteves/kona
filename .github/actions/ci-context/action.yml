name: "CI context"
description: "Populate SHORT_SHA, COMMIT_MESSAGE, COMMIT_CONTEXT, BRANCH_NAME and BRANCH_URL in the job env for Slack notifications."

runs:
  using: "composite"
  steps:
    - name: Set short SHA and branch/PR info
      shell: bash
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BRANCH_NAME="${{ github.head_ref }}"
          COMMIT_MESSAGE="$(echo "${{ github.event.pull_request.head.commit.message }}" | head -n 1 | sed 's/"/\\"/g')"
          BRANCH_URL="${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
        else
          BRANCH_NAME="${{ github.ref_name }}"
          COMMIT_MESSAGE="$(echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g')"
          BRANCH_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}"
        fi

        # COMMIT_CONTEXT is the Slack attachment's first line. Only push/PR events carry a
        # head_commit, so for the two deploy triggers that don't, the usual "<sha> - <message>"
        # renders as a bare hash followed by a dangling dash. Label those by what actually
        # triggered the deploy instead:
        #   repository_dispatch -> a Contentful publish/unpublish (the api's SiteBuildJob). The
        #     commit is just whatever main happened to be at, so the sha is noise — drop it.
        #   workflow_dispatch   -> a manual "Run workflow". The sha IS meaningful (it's what got
        #     deployed), so keep the link and say why there's no message.
        COMMIT_LINK="<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|\`${SHORT_SHA}\`>"
        case "${{ github.event_name }}" in
          repository_dispatch) COMMIT_CONTEXT="Content update — published in Contentful" ;;
          workflow_dispatch)   COMMIT_CONTEXT="Manual rebuild of ${COMMIT_LINK}" ;;
          *)                   COMMIT_CONTEXT="${COMMIT_LINK} - ${COMMIT_MESSAGE}" ;;
        esac

        {
          echo "SHORT_SHA=${SHORT_SHA}"
          echo "BRANCH_NAME=${BRANCH_NAME}"
          echo "COMMIT_MESSAGE=${COMMIT_MESSAGE}"
          echo "BRANCH_URL=${BRANCH_URL}"
          echo "COMMIT_CONTEXT=${COMMIT_CONTEXT}"
        } >> "$GITHUB_ENV"
