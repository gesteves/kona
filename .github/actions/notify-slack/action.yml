name: "Notify Slack"
description: "Post a CI/deploy status message to Slack with the standard commit attachment and workflow footer."

# Each workflow sends its messages through this action. Thus the rules below are what keep the
# channel easy to read. api.yml and web.yml became different one time. Obey these rules when you add
# a message.
#
#   The messages that exist. The checks send one result for each run: a pass or a failure. A deploy
#   sends a message on a success and on a failure. It does NOT send one at the start, on purpose: a
#   Contentful publish starts a web deploy, thus deploys are frequent and a third message for each
#   deploy was too much. Add a message only for a result that the messages above cannot give. The
#   "cache purge successful" message of web is correct, because "deploy successful" goes out at the
#   activation, and the edge can still serve the previous copy.
#
#   The color. good means that it worked. danger means that it failed. warning means that one part
#   worked and that a person must act: the purge failure of web means that the deploy is live but
#   that the edge can serve old content. #439FE0 means more data about something that a message
#   already reported. Never use it for a second success, or each deploy looks like two successes.
#
#   The emoji. :rocket: means that the deploy is successful. :warning: means a failure or a smaller
#   result. :broom: means that the cache purge is complete.
#
#   The text and the fallback. `text` is Slack mrkdwn with ONE link, on the words that give the
#   result ("<url|successful>", "<run|failed>"). A success links to the thing that is now live, and
#   a failure links to the run. `fallback` is a plain one-line summary with NO url. It is the text
#   of the notification preview, the attachment already has the link, and a url there makes the
#   preview difficult to read.
#
#   The name. "<App> <thing> <outcome>", for example "Web checks passed", "API deploy failed", and
#   "Web cache purge successful". The name of the app is what makes a message clear in a channel
#   with both apps, and the fixed shape is what makes the full set easy to read. Do not give the
#   cause of the result in the text: the color and the link to the run give it.

inputs:
  webhook:
    description: "Slack incoming webhook URL."
    required: true
  text:
    description: "Top-level message text (Slack mrkdwn)."
    required: true
  color:
    description: "Attachment color: good, warning, danger, or a hex value."
    required: true
  fallback:
    description: "Plain-text fallback for the attachment."
    required: true

runs:
  using: "composite"
  steps:
    - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.text }}"
          attachments:
            - color: "${{ inputs.color }}"
              fallback: "${{ inputs.fallback }}"
              text: "${{ env.COMMIT_CONTEXT }}"
              footer: "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
