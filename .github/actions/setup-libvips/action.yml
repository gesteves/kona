name: "Set up libvips"
description: "Install libvips (needed by ruby-vips for blurhash generation), with the .deb packages cached via actions/cache to skip the download on subsequent runs."

runs:
  using: "composite"
  steps:
    # Cache the downloaded .deb files (libvips + its dependency tree) in a user-owned dir so
    # actions/cache can restore them without sudo.
    - name: Restore cached libvips packages
      id: libvips-cache
      uses: actions/cache@v4
      with:
        path: ~/apt-debs
        key: apt-libvips-${{ runner.os }}-v1

    - name: Install libvips
      shell: bash
      run: |
        # On a cache miss, download libvips + all its dependencies (not installing yet) and stash
        # the .debs in ~/apt-debs so the cache can keep them. `apt-get clean` first so only the
        # libvips set lands in the archive dir we copy from.
        if [ "${{ steps.libvips-cache.outputs.cache-hit }}" != "true" ]; then
          sudo apt-get update
          sudo apt-get clean
          sudo apt-get install -y --download-only libvips
          mkdir -p ~/apt-debs
          sudo cp /var/cache/apt/archives/*.deb ~/apt-debs/
          sudo chown -R "$(id -u):$(id -g)" ~/apt-debs
        fi
        # Install from the local .debs (apt resolves their inter-dependencies, no network needed
        # when the full set is cached). If anything is missing/corrupt, fall back to a normal
        # install so a bad cache never fails the build — it just costs that run the speedup.
        sudo apt-get install -y ~/apt-debs/*.deb || {
          echo "Cached libvips install incomplete; falling back to a fresh apt install"
          sudo apt-get update && sudo apt-get install -y libvips
        }
