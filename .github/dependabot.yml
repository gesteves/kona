version: 2

# @web.awesome.me/webawesome-pro comes from a private Cloudsmith registry (refer to web/.npmrc).
# Thus Dependabot needs its own credentials. Without them it does nothing for that package, with no
# message, and it still opens a PR for each public package. The `token` here becomes the `_authToken`
# of the registry, as in .npmrc.
# ⚠️ `${{secrets.…}}` reads the *Dependabot* secret store, which is not the Actions store. The same
# token must be in both (Settings → Secrets → Dependabot), or this value is empty. The copy in
# Actions is what `.github/workflows/web.yml` gives to `npm ci`. A run that Dependabot starts reads
# the Dependabot copy, and without it each `npm ci` gets a 401.
registries:
  webawesome:
    type: npm-registry
    url: https://npm.cloudsmith.io/fortawesome/webawesome-pro/
    token: ${{secrets.WEBAWESOME_NPM_TOKEN}}

updates:
  - package-ecosystem: "bundler"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  # Both apps get Web Awesome Pro from the private registry above, thus both need it here.
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/api"
    registries:
      - webawesome
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # The local-only tools in utilities/. Nothing here goes to production, but all three have a
  # lockfile in the repo, and without this entry no CVE would ever change one. utilities/maps also
  # has CI to check each change. They are in one group, on the same weekly schedule as each other
  # entry.
  - package-ecosystem: "bundler"
    directories:
      - "/utilities/maps"
      - "/utilities/aqi-map"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "ruby"
      - "utilities"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/utilities/contentful"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "javascript"
      - "utilities"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # `directory: "/"` covers .github/workflows only. The composite action in
  # .github/actions/notify-slack has its own `uses:`, which is slackapi/slack-github-action. Thus it
  # needs its own entry that points at the folder with its action.yml, or nothing updates it.
  # ci-context is not here, because it uses no action from another repository. Add it if that
  # changes.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/notify-slack"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
