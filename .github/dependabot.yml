version: 2

updates:
  - package-ecosystem: "bundler"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bundler"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore(deps)"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # `directory: "/"` covers .github/workflows only. The composite action in
  # .github/actions/notify-slack has its own `uses:` (slackapi/slack-github-action) and needs its
  # own entry, pointed at the folder holding action.yml, or it never gets updated.
  # ci-context isn't listed because it uses no third-party actions — add it if that changes.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/notify-slack"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
