# The ruleset of Rails, with no change. Refer to api/.rubocop.yml for what it does and for the reason
# that there is no rule override. This app is not Rails, but the ruleset is general Ruby style, and
# one configuration for both apps is the purpose.
#
# RuboCop reads the .rb files only: each ERB template in source/ is markup, and RuboCop does not read
# it.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  Exclude:
    - "build/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"
