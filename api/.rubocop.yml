# Rails' own ruleset, inherited verbatim — no rule overrides on purpose.
#
# It disables every cop department and re-enables 50 named cops (30 Layout, 14 Style, 3 Lint,
# 2 Rails, 1 Performance) out of the 609 RuboCop ships. Notably absent: Metrics and Naming, so
# nothing here polices method length, class length or complexity.
#
# ⚠️ Keep it that way. The point of taking the omakase config is not having a house style to
# argue about; a local override is a style opinion by another name. If a rule genuinely doesn't
# fit, disable it inline at the one site that needs it.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  Exclude:
    # Generated by Rails, not authored here.
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "log/**/*"
