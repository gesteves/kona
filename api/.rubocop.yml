# The ruleset of Rails, with no change and with no rule override, on purpose.
#
# It sets each cop department off and sets 50 named cops on: 30 Layout, 14 Style, 3 Lint, 2 Rails,
# and 1 Performance, of the 609 cops in RuboCop. Metrics and Naming are absent, thus no rule here
# limits the length of a method, the length of a class, or the complexity of the code.
#
# ⚠️ Keep it in that state. The purpose of the omakase configuration is to have no house style to
# discuss, and an override here is a style opinion with another name. If a rule is truly incorrect
# for this code, set it off at the one place that needs that.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  Exclude:
    # Rails made this file. Nobody wrote it here.
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "log/**/*"
