# Sidekiq runs as its own fly.io `worker` process (refer to [processes] in fly.toml). The
# concurrency is low, for the 512MB VM and to stop the backfill jobs of each entry from many
# requests to the PDS at one time, because each job opens its own session. One default queue is
# sufficient for this work.
:concurrency: 5
:queues:
  - default

# The recurring jobs. sidekiq-scheduler runs them in this same worker process. The fly `worker`
# machine has no HTTP service, thus it always runs and it never stops by itself.
#
# ⚠️ Use `cron:`, and not `every:`. rufus-scheduler measures an `every` interval from the start of
# the process. Thus a 6-hour interval starts again at each deploy and can go for a long time with no
# run. A cron entry runs at a clock time, and a restart does not change that. The zone is here
# because fly uses UTC and a development machine does not.
:scheduler:
  :schedule:
    whoop_token_refresh:
      cron: '0 */6 * * * UTC'
      class: WhoopTokenRefreshJob
      queue: default
      description: 'Forces a Whoop token refresh so the rotating refresh token stays alive'
