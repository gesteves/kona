# The responsive-image configuration. `sizes` describes the width of the element, and `widths` is
# the list of the candidates that Cloudflare Images renders.
#
# ⚠️ Each candidate is one transformation for each image. Keep each list small.
#
# The method for a new list, and for a change to a `sizes` value:
#   1. Render the element at the logical width of each device below.
#   2. Measure the element, and do not calculate it. The outdent of a figure, and the gap that
#      changes at the breakpoint, both make the true width different from the column arithmetic.
#   3. Multiply by the scale factor of the device, and round up.
#   4. Remove each duplicate, and add the desktop width at 1x and at 2x.
#
# The devices are the current iPhones, and a desktop at 1280px and above:
#   390, 402, 420, 440 at 3x  — iPhone 17e, iPhone 17 and 17 Pro, iPhone Air, iPhone 17 Pro Max
#
# ⚠️ The FIRST width of a variant must be its 1x desktop width. `cover_image_tag` reads
# `widths.first` for the `src`, in both apps.
#
# ⚠️ api/config/srcsets.yml is a COPY of this file, word for word. The api renders the trending
# card, and its Docker image holds `api/` only, thus it cannot read this file. It uses the `card`
# variant alone, and the other variants stay only to let a person copy the file and compare the
# two. `api/spec/contracts/srcsets_contract_spec.rb` fails when the two are different.
entry:
  sizes:
    - auto
    - "(min-width: 1280px) 800px"
    - "(min-width: 768px) calc((((100vw - 4rem - (11 * 2rem))/12) * 8) + (7 * 2rem))"
    - "calc(100vw - 4rem)"
  widths:
    - 800
    - 1600
    - 978
    - 1014
    - 1068
    - 1128
full:
  sizes:
    - auto
    - "(min-width: 1280px) 1008px"
    - "(min-width: 768px) calc((((100vw - 4rem - (11 * 2rem))/12) * 10) + (9 * 2rem))"
    - "100vw"
  widths:
    - 1008
    - 2016
    - 1170
    - 1206
    - 1260
    - 1320
# ⚠️ This variant has NO `auto`, and each other variant has one. The home page hero is the LCP
# element of that page, thus it is the one image that renders EAGER (refer to render_home_body).
# `auto` is valid on a lazy image only, and a browser ignores it on an eager image. The list below
# is complete without it. Do not add `auto` back unless that image becomes lazy again.
home:
  sizes:
    - "(min-width: 1280px) 488px"
    - "(min-width: 768px) calc((((100vw - 4rem - (11 * 2rem))/12) * 5) + (4 * 2rem))"
    - "calc((((100vw - 4rem - (11 * 1rem))/12) * 5) + (4 * 1rem))"
  widths:
    - 488
    - 976
    - 381
    - 396
    - 417
    - 441
card:
  # The shape of a card cover, as width:height. ⚠️ This is the ONE source of that shape. Both apps
  # read it for the `h` of each candidate, and both write it into the markup as the `--card-ratio`
  # custom property, which _entry.scss and _skeleton.scss then read. Thus a change here, and the
  # `cp` below, is the full change. No other variant has a ratio: only a card crops.
  ratio: "16:9"
  sizes:
    - auto
    - "(min-width: 1280px) 592px"
    - "(min-width: 768px) calc((((100vw - 4rem - (11 * 2rem))/12) * 6) + (5 * 2rem))"
    - "calc(100vw - 4rem)"
  widths:
    - 592
    - 1184
    - 978
    - 1014
    - 1068
    - 1128
