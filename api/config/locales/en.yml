# Rails uses the files in the config/locales directory for the languages, and it
# loads them automatically. To use a language other than English, add the
# necessary files to this directory.
#
# To use the languages, call `I18n.t`:
#
#     I18n.t "hello"
#
# In a view, the shorter name `t` does the same:
#
#     <%= t("hello") %>
#
# To use a different language, set `I18n.locale`:
#
#     I18n.locale = :es
#
# That uses the data in config/locales/es.yml.
#
# For more data about the API, read the Rails Internationalization guide at
# https://guides.rubyonrails.org/i18n.html.
#
# Note that YAML reads these strings as booleans, in each case: `true`, `false`,
# `on`, `off`, `yes`, and `no`. Thus you must put quotation marks around such a
# string to make it a string. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
